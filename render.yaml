# Render Blueprint for kay.apps. This creates separate web, PostgreSQL and Redis services.
# Secrets are generated or entered in Render; never commit real credentials here.
services:
  - type: web
    name: kay-apps
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: ADMIN_EMAIL
        value: kaysmits@icloud.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kay-apps-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: kay-apps-rate-limits
          property: connectionString
      - key: TRUSTED_HOSTS
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1"

  - type: keyvalue
    name: kay-apps-rate-limits
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
    persistenceMode: off

databases:
  - name: kay-apps-db
    databaseName: kay_apps
    user: kay_apps_user
    plan: basic-256mb
    region: frankfurt
    ipAllowList: []
