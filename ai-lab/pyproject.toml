[project]
name = "ai-lab"
version = "0.1.0"
description = "Modulair lab om modellen vanaf nul te bouwen en te toetsen"
requires-python = ">=3.13"
dependencies = ["numpy>=2.0", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["lab*", "adapters*"]
